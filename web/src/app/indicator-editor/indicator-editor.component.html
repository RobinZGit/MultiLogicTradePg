@if (open) {
  <div class="backdrop" (click)="close()" role="presentation"></div>
  <dialog class="dialog dialog-wide" open>
    <header class="dialog-header">
      <h2>{{ title }}</h2>
      <button type="button" class="icon-btn" title="Закрыть" [disabled]="saving" (click)="close()">✕</button>
    </header>
    <div class="dialog-body">
      @if (error) { <p class="error">{{ error }}</p> }
      <form class="form" (ngSubmit)="save()">
        <label class="field">
          <span class="label">Код</span>
          <input type="text" [value]="code" name="code" disabled />
        </label>
        <label class="field">
          <span class="label">Название</span>
          <input type="text" maxlength="100" required [(ngModel)]="name" name="name" [disabled]="saving" />
        </label>
        <label class="field">
          <span class="label">Категория</span>
          <input type="text" maxlength="50" [(ngModel)]="category" name="category" [disabled]="saving" placeholder="trend, momentum, …" />
        </label>
        <label class="field field-description">
          <span class="label">Описание</span>
          <span class="hint">Полное наименование, расчёт, сигналы и применение (несколько абзацев).</span>
          <textarea
            class="desc-area"
            rows="12"
            [(ngModel)]="description"
            name="description"
            [disabled]="saving"
          ></textarea>
        </label>
        <label class="field">
          <span class="label">Формула (script)</span>
          <textarea
            class="mono-area"
            rows="4"
            [(ngModel)]="script"
            name="script"
            [disabled]="saving"
            placeholder="SELECT calc_ind_rsi(:period, :series, :security_id, :timeframe_id, :dt, :indicator_id)"
          ></textarea>
          <span class="hint">
            Плейсхолдеры: :period, :series, :security_id, :timeframe_id, :dt, :indicator_id и параметры индикатора.
          </span>
        </label>
        @if (seriesSummary) {
          <p class="series-hint"><strong>Серии:</strong> {{ seriesSummary }}</p>
        }
        <label class="field field-check">
          <input type="checkbox" [(ngModel)]="isActive" name="isActive" [disabled]="saving" />
          <span>Активен</span>
        </label>
        <footer class="dialog-footer">
          <button type="button" class="btn btn-secondary" [disabled]="saving" (click)="close()">Отмена</button>
          <button type="submit" class="btn btn-primary" [disabled]="saving">{{ saving ? 'Сохранение…' : 'Сохранить' }}</button>
        </footer>
      </form>
    </div>
  </dialog>
}
